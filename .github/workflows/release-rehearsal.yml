name: Release rehearsal

# Manual-only proof that the release pipeline works, run before a tag exists.
#
# This workflow deliberately never triggers on `push`/`tags` and never runs
# the publish step: no GitHub Release, no release-asset upload, no push of
# any kind. It exists so a maintainer can exercise the exact build,
# packaging, checksum, and SBOM steps release.yml uses - across every
# advertised target - and get a pass/fail answer before cutting a real tag.
#
# Why this duplicates release.yml's steps instead of calling it as a
# `workflow_call` reusable workflow: release.yml's build job derives its
# version from `github.ref_name` (a real tag) and feeds it into two places
# that are explicitly "already fixed, do not change" per the release
# hardening work - the "Verify tag matches Cargo.toml version" step and the
# tag-vs-`--version`-output check inside "Smoke-test the release binary".
# A rehearsal has no tag, so it needs a synthetic version (the
# `version` input below) that is NOT required to match Cargo.toml. Threading
# that synthetic version through release.yml would mean adding
# event-type conditionals inside those two protected checks (skip the
# Cargo.toml comparison, skip the --version substring check) plus rewriting
# every `github.ref_name` reference in the build job to an indirected
# variable - i.e. editing the inside of the exact steps this task was told
# to leave alone. Duplicating the (much simpler) build/package/checksum/SBOM
# commands here, unchanged in substance, was the lower-risk option.
#
# Maintenance note: if you change the cargo build invocation, the packaging
# layout, the checksum method, or the SBOM action/config in release.yml's
# `build` or `release` jobs, mirror the change here too.
on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version string to rehearse (e.g. v0.3.0-rc1). Stands in for
          github.ref_name, since a rehearsal has no tag to read it from.
          Purely a label for archive/SBOM naming - it is not checked against
          Cargo.toml.
        required: false
        default: "v0.3.0-rc1"

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: mcptracer

# Deliberately minimal: no contents:write (nothing is ever pushed or
# published), no id-token/attestations (see the note on SBOM generation in
# the rehearse-summary job below - attestation is skipped entirely here, so
# those permissions are never requested).
permissions:
  contents: read

jobs:
  build:
    name: Rehearse build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
          # Native ARM64 runner (not cross-compilation) so the binary can
          # actually be executed below. Same reasoning as release.yml.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive_ext: tar.gz
          # Intel runner on purpose - see release.yml's build matrix for why
          # (Rosetta 2 is not available on GitHub's ARM macOS images, and
          # macos-13 was retired by GitHub in December 2025).
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive_ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
    steps:
      # Tag v4 -> 11d5960a326750d5838078e36cf38b85af677262 (2026-07-16).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Tag v2 -> e18b497796c12c097a38f9edb9d0641fb99eee32 (2026-03-12).
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: rehearsal-${{ matrix.target }}

      # Needed to invoke scripts/source_preview_smoke.py below. Mirrors the
      # setup-python usage already established in release.yml/ci.yml/
      # oss-export.yml - same action, same pin, same version.
      # Tag v5 -> a26af69be951a213d495a4c3e4e4022e16d87065 (2025-04-24).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Build release binary
        run: cargo build --release --locked --bin ${{ env.BIN_NAME }} --target ${{ matrix.target }}

      - name: Smoke-test the release binary
        # No tag exists, so - unlike release.yml's equivalent step - there is
        # nothing to compare --version output against. Just prove it runs.
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/${{ env.BIN_NAME }}"
          if [[ "${{ matrix.archive_ext }}" == "zip" ]]; then
            bin="${bin}.exe"
          fi
          "$bin" --version

      - name: Package (unix)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          staging="${{ env.BIN_NAME }}-${{ inputs.version }}-${{ matrix.target }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/${{ env.BIN_NAME }}" "$staging/"
          cp README.md LICENSE NOTICE COMMERCIAL-LICENSE.md CHANGELOG.md "$staging/"
          tar czf "$staging.tar.gz" "$staging"
          sha256sum "$staging.tar.gz" > "$staging.tar.gz.sha256"
          echo "ASSET=$staging.tar.gz" >> "$GITHUB_ENV"
          echo "CHECKSUM=$staging.tar.gz.sha256" >> "$GITHUB_ENV"
          echo "STAGING=$staging" >> "$GITHUB_ENV"

      - name: Package (windows)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          $staging = "${{ env.BIN_NAME }}-${{ inputs.version }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ env.BIN_NAME }}.exe" $staging
          Copy-Item README.md,LICENSE,NOTICE,COMMERCIAL-LICENSE.md,CHANGELOG.md $staging
          Compress-Archive -Path $staging -DestinationPath "$staging.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "$staging.zip").Hash.ToLower()
          # Out-File defaults to CRLF on Windows, which would corrupt a
          # combined SHA256SUMS.txt the same way release.yml's comment
          # describes. Write LF explicitly for consistency, even though this
          # rehearsal verifies each checksum independently below rather than
          # combining them into one file per target.
          [System.IO.File]::WriteAllText("$staging.zip.sha256", "$hash  $staging.zip`n")
          Add-Content -Path $env:GITHUB_ENV -Value "ASSET=$staging.zip"
          Add-Content -Path $env:GITHUB_ENV -Value "CHECKSUM=$staging.zip.sha256"
          Add-Content -Path $env:GITHUB_ENV -Value "STAGING=$staging"

      - name: Verify checksum matches archive (recomputed, not trusted)
        # Actually recompute the hash rather than trusting the .sha256 file
        # the previous step just wrote - that would only prove the file
        # writer and the file reader agree with themselves, not that the
        # checksum is correct.
        shell: bash
        run: |
          set -euo pipefail
          recomputed="$(sha256sum "${{ env.ASSET }}" | awk '{print $1}')"
          recorded="$(awk '{print $1}' "${{ env.CHECKSUM }}")"
          if [ "$recomputed" != "$recorded" ]; then
            echo "ERROR: recomputed sha256 ($recomputed) for ${{ env.ASSET }} does not match the recorded checksum ($recorded) in ${{ env.CHECKSUM }}" >&2
            exit 1
          fi
          echo "Checksum verified: $recomputed"

      - name: Extract archive (unix)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf rehearsal-extract
          mkdir -p rehearsal-extract
          tar xzf "${{ env.ASSET }}" -C rehearsal-extract
          echo "EXTRACTED=rehearsal-extract/${{ env.STAGING }}" >> "$GITHUB_ENV"

      - name: Extract archive (windows)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force rehearsal-extract -ErrorAction SilentlyContinue
          Expand-Archive -Path "${{ env.ASSET }}" -DestinationPath rehearsal-extract
          Add-Content -Path $env:GITHUB_ENV -Value "EXTRACTED=rehearsal-extract/${{ env.STAGING }}"

      - name: Run the extracted binary
        # Executes the binary that came OUT of the archive, not the one
        # still sitting in target/ - that is the whole point of the
        # rehearsal: prove what a downloader actually gets works, not just
        # what the build step produced.
        shell: bash
        run: |
          set -euo pipefail
          bin="${{ env.EXTRACTED }}/${{ env.BIN_NAME }}"
          if [[ "${{ matrix.archive_ext }}" == "zip" ]]; then
            bin="${bin}.exe"
          fi
          "$bin" --version
          echo "BIN_PATH=$bin" >> "$GITHUB_ENV"

      - name: Verify archive contains required files
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for f in README.md LICENSE NOTICE COMMERCIAL-LICENSE.md CHANGELOG.md; do
            if [ ! -f "${{ env.EXTRACTED }}/$f" ]; then
              missing+=("$f")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "ERROR: ${{ env.ASSET }} is missing required file(s): ${missing[*]}" >&2
            exit 1
          fi
          echo "All required files present: README.md LICENSE NOTICE COMMERCIAL-LICENSE.md CHANGELOG.md"

      - name: Run end-to-end scenario against the extracted binary
        # Drives the real record -> validate -> replay -> diff rug-pull
        # tutorial against the binary that shipped in the archive, using the
        # --binary option so the script skips its own cargo build and tests
        # the artifact this job just packaged.
        #
        # The candidate directory is not always `.`. source_preview_smoke.py
        # starts by verifying the candidate against OSS_EXPORT_MANIFEST.json,
        # which exists only in a *generated* tree. The public repository's
        # checkout is such a tree, so `.` works there. The private source
        # repository has no manifest at its root, so `.` fails export
        # verification before the binary is ever exercised - confirmed by
        # running it. Generate a throwaway export in that case; the exporter
        # is a reserved path, so it is present exactly when it is needed.
        shell: bash
        run: |
          set -euo pipefail
          if [ -f OSS_EXPORT_MANIFEST.json ]; then
            candidate="."
            echo "Candidate: this checkout (generated tree, manifest present)"
          elif [ -f scripts/export_oss.py ]; then
            candidate="$RUNNER_TEMP/rehearsal-candidate"
            rm -rf "$candidate"
            python scripts/export_oss.py --ref HEAD --output "$candidate"
            echo "Candidate: freshly generated export at $candidate"
          else
            echo "ERROR: no OSS_EXPORT_MANIFEST.json and no scripts/export_oss.py;" >&2
            echo "cannot establish a candidate tree for the smoke runner." >&2
            exit 1
          fi
          python scripts/source_preview_smoke.py "$candidate" --binary "${{ env.BIN_PATH }}"

      # Tag v4 -> ea165f8d65b6e75b540449e92b4886f43607fa02 (2025-03-19).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ASSET }}
            ${{ env.CHECKSUM }}
          if-no-files-found: error

  rehearse-summary:
    name: Combine checksums and generate SBOM
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Tag v4 -> 11d5960a326750d5838078e36cf38b85af677262 (2026-07-16).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # Tag v4 -> d3f86a106a0bac45b974a628896c90dbdf5c8093 (2025-04-24).
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          merge-multiple: true

      - name: Combine checksums
        run: |
          set -euo pipefail
          cat dist/*.sha256 | tr -d '\r' | sort -k2 > dist/SHA256SUMS.txt

      - name: Verify combined checksums are self-consistent
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS.txt
          echo "All archive checksums verified."

      - name: Generate SBOM
        # Same tool and format release.yml uses for the real release SBOM.
        # No "Attest SBOM provenance" step here on purpose: attestation
        # needs id-token: write and attestations: write, and this rehearsal
        # requests neither - it only needs to prove the SBOM generates
        # cleanly, not that a provenance record can be signed for a build
        # that isn't actually being published. Skipping it keeps this
        # workflow's permissions at contents: read.
        # Tag v0 -> e22c389904149dbc22b58101806040fa8d37a610 (2026-03-19).
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/${{ env.BIN_NAME }}-${{ inputs.version }}.cdx.json

      # This is a workflow artifact (build log/debug output), not a GitHub
      # Release asset - it is not attached to any release and nothing is
      # published by uploading it. Lets a maintainer inspect the rehearsed
      # SBOM and combined checksums without re-running the workflow.
      # Tag v4 -> ea165f8d65b6e75b540449e92b4886f43607fa02 (2025-03-19).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rehearsal-dist
          path: dist/
          if-no-files-found: error

      - name: Rehearsal passed
        run: |
          echo "Release rehearsal for ${{ inputs.version }} passed - build, package, checksum, SBOM, and end-to-end scenario all succeeded for every advertised target."
