name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      # Pin to a reviewed commit SHA (verified against the GitHub API).
      # Tag v4 -> 11d5960a326750d5838078e36cf38b85af677262 (2026-07-16).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # Intentionally left on the `stable`/`1.85` tags rather than pinned to a
      # commit SHA like the other actions in this file. dtolnay/rust-toolchain
      # is not a normal action: the tag itself is the version selector for
      # the Rust toolchain it installs, so pinning it to a SHA would freeze
      # us to whatever Rust was "stable" the day that SHA was reviewed and
      # defeat the point of tracking `stable`. Accepted exception -- do not
      # "fix" this to a SHA.
      - uses: dtolnay/rust-toolchain@stable
      # Tag v2 -> e18b497796c12c097a38f9edb9d0641fb99eee32 (2026-03-12).
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      # Tag v5 -> a26af69be951a213d495a4c3e4e4022e16d87065 (2025-04-24).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify packaged licensing and attribution
        run: python scripts/sync_license_files.py --check
      - name: Rust tests (workspace, default features)
        run: cargo test --workspace --locked
      - name: Rust tests (proxy, Labs-only features)
        run: cargo test -p mcptracer-proxy --features labs --locked
      - name: Rust tests (proxy, semantic-search features)
        run: cargo test -p mcptracer-proxy --features semantic-search --locked
      - name: Rust tests (workspace, all features)
        run: cargo test --workspace --all-features --locked
      - name: Integration test
        run: |
          cargo build --bin mcptracer --locked
          python tests/test_proxy_integration.py
      - name: Build Labs-only CLI
        run: cargo build --bin mcptracer --features labs --locked
      - name: Build semantic-search CLI
        run: cargo build --bin mcptracer --features semantic-search --locked
      - name: Python verifier, identity, installer and consumer regressions
        # Discovery roots imports in this directory even if site-packages has
        # an unrelated package named tests. Includes ELF packaging checks.
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Set up Node for wrapper and inspector regressions
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Node wrapper and inspector client regressions
        run: node --test packages/npm/mcptracer/test/discovery.test.js tests/inspector-client.test.cjs
      - name: Isolated source installation and first-use tutorial
        # A fresh prefix/target prevents a preinstalled or feature-switched
        # development binary from standing in for a user's source install.
        run: python scripts/source_preview_smoke.py .

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # The default build leaves the Labs commands out; keep it warning-free
      # too (anything used only by a feature-gated module shows up here).
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        # --deny warnings makes any RUSTSEC advisory fail the job. Use
        # --ignore <RUSTSEC-YYYY-NNN> in the future to exempt an advisory
        # that is not exploitable in this project, documented in the PR.
        run: cargo audit --deny warnings

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@stable
      # Tag v2 -> e18b497796c12c097a38f9edb9d0641fb99eee32 (2026-03-12).
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: Generated CLI/capability references are not stale
        # Both scripts regenerate their page from the real `mcptracer --help`
        # output; a diff here means a command or flag shipped without the
        # docs being regenerated -- exactly the drift T-88 exists to prevent.
        run: |
          bash scripts/generate-cli-reference.sh
          bash scripts/generate-capability-reference.sh
          git diff --exit-code -- docs-site/src/reference/cli.md docs-site/src/reference/capabilities.md
      - name: Install mdBook
        run: cargo install mdbook --locked --version ^0.5
      - name: Build book
        run: mdbook build docs-site

  compat:
    name: Real-SDK compatibility matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      # Tag v7.0.0 -> 820762786026740c76f36085b0efc47a31fe5020 (2026-07-14).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      # Tag v7.0.0 -> b7ad1dad31e06c5925ef5d2fc7ad053ef454303e (2026-07-16).
      # The Go SDK server's go.mod requires Go 1.25 (the SDK's own minimum).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: tests/compat/servers/go-stdio/go.mod
          cache-dependency-path: |
            tests/compat/servers/go-stdio/go.sum
            tests/compat/servers/go-modern-stdio/go.sum
            tests/compat/servers/go-modern-http/go.sum
            tests/compat/servers/go-cancellation/go.sum
      - name: Build release binary
        run: cargo build --release --locked -p mcptracer-proxy
      - name: Install TypeScript SDK server dependencies (stdio)
        run: npm ci
        working-directory: tests/compat/servers/ts-stdio
      - name: Install TypeScript SDK cancellation smoke dependencies
        run: npm ci
        working-directory: tests/compat/servers/ts-cancellation
      - name: Install TypeScript SDK v2 server dependencies (2026-07-28 stdio)
        run: npm ci
        working-directory: tests/compat/servers/ts-modern-stdio
      - name: Install TypeScript SDK v2 server dependencies (2026-07-28 Streamable HTTP)
        run: npm ci
        working-directory: tests/compat/servers/ts-modern-http
      - name: Install TypeScript SDK server dependencies (HTTP)
        run: npm ci
        working-directory: tests/compat/servers/ts-http
      - name: Fetch and compile Go SDK server (stdio)
        # Fails here, with a clear cause, rather than as a timeout inside
        # run_matrix.py's first `go run`.
        run: |
          go mod download
          go vet ./...
        working-directory: tests/compat/servers/go-stdio
      - name: Fetch and compile Go SDK server (2026-07-28 stdio)
        # Keep dependency failures separate from the real-SDK compatibility run.
        run: |
          go mod download
          go vet ./...
        working-directory: tests/compat/servers/go-modern-stdio
      - name: Fetch and compile Go SDK server (2026-07-28 HTTP)
        run: |
          go mod download
          go vet ./...
        working-directory: tests/compat/servers/go-modern-http
      - name: Install Python SDK server dependencies
        # py-stdio and py-http pin the identical mcp version; one install
        # into the setup-python interpreter covers both cells.
        run: python -m pip install -r requirements.txt
        working-directory: tests/compat/servers/py-http
      - name: Install modern Python SDK server dependencies
        shell: bash
        run: |
          venv_dir="${RUNNER_TEMP}/mcp-python-v2"
          python -m venv "$venv_dir"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            venv_python="$venv_dir/Scripts/python.exe"
          else
            venv_python="$venv_dir/bin/python"
          fi
          echo "MCPTRACER_COMPAT_PY_V2=$venv_python" >> "$GITHUB_ENV"
          "$venv_python" -m pip install -r tests/compat/servers/py-modern-stdio/requirements.txt
          venv_site="$("$venv_python" -c 'import site; print(site.getsitepackages()[0])')"
          echo "MCPTRACER_COMPAT_PY_V2_SITE=$venv_site" >> "$GITHUB_ENV"
      - name: Set MCPTRACER_BIN to the just-built release binary
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "MCPTRACER_BIN=${{ github.workspace }}/target/release/mcptracer.exe" >> "$GITHUB_ENV"
          else
            echo "MCPTRACER_BIN=${{ github.workspace }}/target/release/mcptracer" >> "$GITHUB_ENV"
          fi
      - name: Run compatibility matrix
        # run_matrix.py itself tracks each cell's required/optional flag from
        # matrix.toml and returns one exit code for the whole run -- this
        # step intentionally does not set continue-on-error, so a required
        # cell's failure fails the job.
        run: python tests/compat/run_matrix.py
      - name: Fetch and compile Go SDK cancellation smoke
        run: |
          go mod download
          go vet ./...
        working-directory: tests/compat/servers/go-cancellation
      - name: Run real TypeScript SDK cancellation capture and replay
        run: npm run smoke
        working-directory: tests/compat/servers/ts-cancellation
      - name: Run real Go SDK cancellation capture and replay
        run: go run .
        working-directory: tests/compat/servers/go-cancellation

      - name: Run real Python SDK cancellation capture and replay
        shell: bash
        run: '"$MCPTRACER_COMPAT_PY_V2" tests/compat/run_python_v2_cancellation.py'

  msrv:
    name: MSRV (Rust 1.85)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - run: cargo test --all --locked
