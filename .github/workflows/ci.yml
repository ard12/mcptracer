name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      # Pin to a reviewed commit SHA (verified against the GitHub API).
      # Tag v4 -> 11d5960a326750d5838078e36cf38b85af677262 (2026-07-16).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # Intentionally left on the `stable`/`1.85` tags rather than pinned to a
      # commit SHA like the other actions in this file. dtolnay/rust-toolchain
      # is not a normal action: the tag itself is the version selector for
      # the Rust toolchain it installs, so pinning it to a SHA would freeze
      # us to whatever Rust was "stable" the day that SHA was reviewed and
      # defeat the point of tracking `stable`. Accepted exception -- do not
      # "fix" this to a SHA.
      - uses: dtolnay/rust-toolchain@stable
      # Tag v2 -> e18b497796c12c097a38f9edb9d0641fb99eee32 (2026-03-12).
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      # Tag v5 -> a26af69be951a213d495a4c3e4e4022e16d87065 (2025-04-24).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify packaged licensing and attribution
        run: python scripts/sync_license_files.py --check
      - name: Rust tests (workspace, all features)
        run: cargo test --workspace --all-features --locked
      - name: Integration test
        run: |
          cargo build --bin mcptracer --locked
          python tests/test_proxy_integration.py

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        # --deny warnings makes any RUSTSEC advisory fail the job. Use
        # --ignore <RUSTSEC-YYYY-NNN> in the future to exempt an advisory
        # that is not exploitable in this project, documented in the PR.
        run: cargo audit --deny warnings

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@stable
      # Tag v2 -> e18b497796c12c097a38f9edb9d0641fb99eee32 (2026-03-12).
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: Generated CLI/capability references are not stale
        # Both scripts regenerate their page from the real `mcptracer --help`
        # output; a diff here means a command or flag shipped without the
        # docs being regenerated -- exactly the drift T-88 exists to prevent.
        run: |
          bash scripts/generate-cli-reference.sh
          bash scripts/generate-capability-reference.sh
          git diff --exit-code -- docs-site/src/reference/cli.md docs-site/src/reference/capabilities.md
      - name: Install mdBook
        run: cargo install mdbook --locked --version ^0.5
      - name: Build book
        run: mdbook build docs-site

  compat:
    name: Real-SDK compatibility matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      # Tag v7.0.0 -> 820762786026740c76f36085b0efc47a31fe5020 (2026-07-14).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Build release binary
        run: cargo build --release --locked -p mcptracer-proxy
      - name: Install TypeScript SDK server dependencies (stdio)
        run: npm install
        working-directory: tests/compat/servers/ts-stdio
      - name: Install TypeScript SDK server dependencies (HTTP)
        run: npm install
        working-directory: tests/compat/servers/ts-http
      - name: Install Python SDK server dependencies
        # py-stdio and py-http pin the identical mcp version; one install
        # into the setup-python interpreter covers both cells.
        run: python -m pip install -r requirements.txt
        working-directory: tests/compat/servers/py-http
      - name: Set MCPTRACER_BIN to the just-built release binary
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "MCPTRACER_BIN=${{ github.workspace }}/target/release/mcptracer.exe" >> "$GITHUB_ENV"
          else
            echo "MCPTRACER_BIN=${{ github.workspace }}/target/release/mcptracer" >> "$GITHUB_ENV"
          fi
      - name: Run compatibility matrix
        # run_matrix.py itself tracks each cell's required/optional flag from
        # matrix.toml and returns one exit code for the whole run -- this
        # step intentionally does not set continue-on-error, so a required
        # cell's failure fails the job.
        run: python tests/compat/run_matrix.py

  msrv:
    name: MSRV (Rust 1.85)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - run: cargo test --all --locked
