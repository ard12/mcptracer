# MCPTracer real-SDK compatibility matrix. One [[cell]] per SDK version, protocol era, and transport
# combination. See tests/compat/README.md for how to run a single cell
# locally and docs/spec/compatibility-matrix.md for published results.
#
# `required = true` cells make run_matrix.py exit nonzero on failure (CI
# gate). `required = false` cells are recorded but never block the run --
# use that for a cell known to carry a disclosed, diagnosed SDK difference
# rather than deleting coverage for it.

[[cell]]
id = "ts-stdio"
sdk = "typescript"
sdk_package = "@modelcontextprotocol/sdk"
sdk_version = "^1.30.0"
transport = "stdio"
server_dir = "servers/ts-stdio"
command = ["node", "server.js"]
rugpull_env = "MCPTRACER_COMPAT_RUGPULL"
required = true

[[cell]]
id = "py-stdio"
sdk = "python"
sdk_package = "mcp"
sdk_version = "1.29.0"
transport = "stdio"
server_dir = "servers/py-stdio"
command = ["python3", "server.py"]
rugpull_env = "MCPTRACER_COMPAT_RUGPULL"
required = false
# Diagnosed 2026-08-15, confirmed independent of MCPTracer: the SDK's own
# stdio transport (FastMCP, anyio-based) can lose the response to the LAST
# in-flight tool call if stdin reaches EOF before that call's async response
# task finishes. Reproduced by piping the same client script directly into
# `python server.py` with zero MCPTracer/proxy involvement -- flaky there
# too (2-3 responses out of 3 across repeated runs), and adding an explicit
# 300ms delay before closing stdin did not make it reliable, ruling out a
# simple EOF-timing race. It is always the tools/call response (never
# initialize or tools/list) that goes missing. See
# docs/spec/compatibility-matrix.md for the full writeup. Left as
# required = false rather than removed, so the flakiness stays visible
# instead of being silently dropped from coverage.

[[cell]]
id = "ts-http"
sdk = "typescript"
sdk_package = "@modelcontextprotocol/sdk"
sdk_version = "^1.30.0"
transport = "http"
server_dir = "servers/ts-http"
command = ["node", "server.js"]
rugpull_env = "MCPTRACER_COMPAT_RUGPULL"
required = true

[[cell]]
id = "py-http"
sdk = "python"
sdk_package = "mcp"
sdk_version = "1.29.0"
transport = "http"
server_dir = "servers/py-http"
command = ["python3", "server.py"]
rugpull_env = "MCPTRACER_COMPAT_RUGPULL"
required = true

[[cell]]
id = "go-stdio"
sdk = "go"
sdk_package = "github.com/modelcontextprotocol/go-sdk"
sdk_version = "1.8.0"
transport = "stdio"
server_dir = "servers/go-stdio"
command = ["go", "run", "."]
rugpull_env = "MCPTRACER_COMPAT_RUGPULL"
required = true
# Diagnosed 2026-09-21, independent of MCPTracer: on stdin EOF the Go SDK
# cancels every request still in flight (internal/jsonrpc2/conn.go
# readIncoming: "with the reader gone we ... likely cannot write a response
# either"). Feeding the same script straight into the server with no
# MCPTracer involved, closing stdin after <=5ms returned 0 of 3 responses on
# 10/10 runs, and closing it after >=20ms returned 3 of 3 on 10/10 runs. That
# is deliberate SDK behavior, not a race. The harness's default client hands
# over the whole script and hits EOF immediately, which is not how a real MCP
# client behaves, so this cell drives `record` interactively: it keeps stdin
# open until every request has its response (no sleeps). See
# docs/spec/compatibility-matrix.md.
interactive_client = true


[[cell]]
id = "go-modern-stdio"
sdk = "go"
sdk_package = "github.com/modelcontextprotocol/go-sdk"
sdk_version = "1.7.0"
transport = "stdio"
server_dir = "servers/go-modern-stdio"
command = ["go", "run", "."]
rugpull_env = "MCPTRACER_COMPAT_RUGPULL"
required = true
client_script = "client_scripts/2026-07-28.jsonl"
interactive_client = true


[[cell]]
id = "py-modern-stdio"
sdk = "python"
sdk_package = "mcp"
sdk_version = "2.2.0"
transport = "stdio"
server_dir = "servers/py-modern-stdio"
command = ["python", "server.py"]
command_env_var = "MCPTRACER_COMPAT_PY_V2"
rugpull_env = "MCPTRACER_COMPAT_RUGPULL"
required = true
client_script = "client_scripts/2026-07-28-python.jsonl"
interactive_client = true


[[cell]]
id = "py-modern-http"
sdk = "python"
sdk_package = "mcp"
sdk_version = "2.2.0"
transport = "http"
server_dir = "servers/py-modern-http"
command = ["python", "server.py"]
command_env_var = "MCPTRACER_COMPAT_PY_V2"
rugpull_env = "MCPTRACER_COMPAT_RUGPULL"
required = true
client_script = "client_scripts/2026-07-28-python.jsonl"
group_stateless_by_header = "X-MCPTracer-Compat-Trace"

